PACKAGE_NAME="apple-cdc-ncm"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="cdc_ncm"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
PRE_BUILD="prepare.sh ${kernelver}"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"

# Self-retire: skip kernels whose in-tree cdc_ncm already matches the Mac.
# Keep in sync with kernel_has_quirk in scripts/lib.sh.
if [ -n "${kernelver:-}" ]; then
  _mgdl_ko=$(ls "${MGDL_MODULES_DIR:-/lib/modules}/${kernelver}"/kernel/drivers/net/usb/cdc_ncm.ko* 2>/dev/null | head -n1)
  if [ -n "$_mgdl_ko" ] \
     && modinfo -F alias "$_mgdl_ko" 2>/dev/null | grep -qi 'v05ACp1905.*in00' \
     && modinfo -F alias "$_mgdl_ko" 2>/dev/null | grep -qi 'v05ACp1905.*in02'; then
    BUILD_EXCLUSIVE_KERNEL="^mgdl-upstream-quirk-present$"
  fi
  unset _mgdl_ko
fi
