GX10_IP=192.168.20.20/24
MAC_IP=192.168.20.17/24
MTU=8178           # must match the Mac side; macos/setup.sh applies it
IFACE_NUM=0        # USB interface number that carries traffic; confirm on hardware
IFACE_PREFIX=macncm
# Throughput tuning applied by apple-ncm-tune when the link comes up.
TUNE_IRQ_CPU=5     # CPU for the xHCI interrupt; pick a big core, not CPU0
TUNE_RPS_MASK=3c0  # hex CPU mask for RX packet steering (CPUs 6-9)
NTB_MAX=32764      # cdc_ncm rx_max/tx_max; the Mac's maximum NTB size
TXQLEN=10000