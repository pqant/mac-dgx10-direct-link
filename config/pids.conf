# Apple USB PIDs (VID 05ac) known to present the CDC-NCM private interface
# (apple_private_interface_info) on interface numbers 0 and 2. Format: one
# lowercase 4-hex PID per line, '#' starts a comment.
#
# M0 baseline (GX10, kernel 7.0.0-1019-nvidia): the M5 Max enumerates as
# 05ac:1905 at 10000M with interfaces 0/2 (Communications) and 1/3 (CDC Data),
# and the in-tree cdc_ncm has no alias for it, so the DKMS module is required.
1905
1902
